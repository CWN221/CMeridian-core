# Grafana Datasources Configuration

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    version: 1
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 3.14.0

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: banking_system
    user: bank_user
    secureJsonData:
      password: SecurePass123!
    isDefault: false
    editable: true
    version: 1
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: true
    version: 1
    jsonData:
      timeField: "@timestamp"
      esVersion: 8.0.0
      maxConcurrentShardRequests: 5
      interval: Daily