groups:
  - name: meridian-core-alerts
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="spring-boot"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Meridian backend is down"
          description: "Backend unreachable for 2 minutes."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate"
          description: "{{ $value }} per second."

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow responses"
          description: "p95 latency {{ $value }}s."

      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB pool at {{ $value | humanizePercentage }}"

      - alert: HighHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap at {{ $value | humanizePercentage }}"

      - alert: FrequentGarbageCollection
        expr: rate(jvm_gc_pause_seconds_count[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GC rate {{ $value }} per second"